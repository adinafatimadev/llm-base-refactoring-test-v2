name: PR
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run typecheck --filter='...[origin/main...HEAD]'
      - run: pnpm exec turbo run lint --filter='...[origin/main...HEAD]'
      - run: pnpm exec turbo run test:unit --filter='...[origin/main...HEAD]'
      - run: pnpm exec turbo run build --filter='...[origin/main...HEAD]'